name: Build AutoSplit AI APK

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Package APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Environment Files
        run: |
          touch .env
          if [ -f "debug.keystore.base64" ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          else
            keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Make Gradle Wrapper Executable
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AutoSplit-AI-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Summary
        run: |
          echo "### 🚀 AutoSplit AI Build Completed!" >> $GITHUB_STEP_SUMMARY
          echo "The APK has been successfully compiled and uploaded as an artifact." >> $GITHUB_STEP_SUMMARY
          echo "Scroll to the **Artifacts** section at the bottom of this Action run page to download **AutoSplit-AI-Debug-APK**." >> $GITHUB_STEP_SUMMARY
